name: Deploy to ECS (staging)

# Manual only while the ECS move is validated; the Lambda deploys are unchanged.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to deploy. Defaults to the branch the workflow is run from."
        required: false
        type: string

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: portal-backend-staging
  ECS_CLUSTER: portal-backend-staging
  ECS_SERVICE: portal-backend-staging
  CONTAINER_NAME: portal-backend
  SERVICE_HOST: staging-portal-backend.avantifellows.org
  # The task definition is read from Terraform state (terraform/ecs.tf is the source of truth).
  TF_STATE_BUCKET: 111766607077-dbservice-test-terraform-state
  TF_STATE_KEY: portal-backend/staging/terraform.tfstate
  SECRET_ARN_PREFIX: arn:aws:secretsmanager:ap-south-1:111766607077:secret:portal-backend/staging/app-

concurrency:
  group: deploy-ecs-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::111766607077:role/portal-backend-ecs-staging-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          TAG="staging-$(git rev-parse HEAD)"
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          # Tags are immutable, so a re-run of the same commit reuses the image already pushed.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "Image $TAG already in ECR, skipping build."
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # No describe-task-definition: that permission can't be scoped and would expose every
      # service's task definition. Nothing from the state file or task definition is printed.
      - name: Read task definition from Terraform state
        id: taskdef
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/tfstate.json"
          OUT="$RUNNER_TEMP/task-definition.json"
          aws s3 cp "s3://${TF_STATE_BUCKET}/${TF_STATE_KEY}" "$STATE" --only-show-errors

          if ! jq -e '
              [.resources[] | select(.mode == "managed" and .type == "aws_ecs_task_definition" and .name == "this") | .instances[]]
              | if length == 1 then .[0].attributes else error("count") end
              | {
                  family,
                  containerDefinitions: (.container_definitions | fromjson),
                  cpu,
                  memory,
                  networkMode: .network_mode,
                  requiresCompatibilities: .requires_compatibilities,
                  executionRoleArn: .execution_role_arn
                }
              | if ([.family, .cpu, .memory, .networkMode, .executionRoleArn] | all(. != null and . != ""))
                   and (.containerDefinitions | length == 1)
                then . else error("fields") end
            ' "$STATE" > "$OUT" 2> /dev/null; then
            rm -f "$STATE" "$OUT"
            echo "::error::Could not read exactly one complete aws_ecs_task_definition.this from Terraform state. Is an apply running or did one fail?"
            exit 1
          fi

          # Values must come only from Secrets Manager, never plain-text env.
          if ! jq -e '[.containerDefinitions[0].environment[]?.name] - ["WEB_CONCURRENCY", "AWS_DEFAULT_REGION"] | length == 0' \
               "$OUT" > /dev/null 2>&1; then
            rm -f "$STATE" "$OUT"
            echo "::error::The task definition in state has plain-text env vars besides WEB_CONCURRENCY/AWS_DEFAULT_REGION. Move them to the Secrets Manager secret (see terraform/README.md)."
            exit 1
          fi
          if ! jq -e --arg p "$SECRET_ARN_PREFIX" \
               '[.containerDefinitions[0].secrets[]?.valueFrom] | length > 0 and all(startswith($p))' \
               "$OUT" > /dev/null 2>&1; then
            rm -f "$STATE" "$OUT"
            echo "::error::The task definition in state has no secrets, or secrets outside portal-backend/staging/app."
            exit 1
          fi

          ALB_DNS=$(jq -er '.outputs.alb_dns_name.value' "$STATE" 2> /dev/null) || {
            rm -f "$STATE" "$OUT"
            echo "::error::alb_dns_name output missing from Terraform state."
            exit 1
          }
          rm -f "$STATE"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

      - name: Render new task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.taskdef.outputs.file }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - name: Register task definition and update service
        id: register
        run: |
          set -euo pipefail
          ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://${{ steps.render.outputs.task-definition }}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$ARN" > /dev/null
          DESIRED=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].desiredCount' --output text)
          echo "desired=$DESIRED" >> "$GITHUB_OUTPUT"

      - name: Wait for the rollout
        if: steps.register.outputs.desired != '0'
        run: |
          set -euo pipefail
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          ACTIVE=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" --output text)
          if [ "$ACTIVE" != "${{ steps.register.outputs.arn }}" ]; then
            echo "::error::Rollout did not finish on the new task definition; ECS probably rolled it back."
            exit 1
          fi

      - name: Smoke check
        if: steps.register.outputs.desired != '0'
        run: |
          set -euo pipefail
          ALB_DNS="${{ steps.taskdef.outputs.alb_dns }}"
          ALB_IP=$(getent hosts "$ALB_DNS" | awk '{print $1; exit}')
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sk -o /dev/null -w "%{http_code}" \
              --resolve "${SERVICE_HOST}:443:${ALB_IP}" "https://${SERVICE_HOST}/health" || echo 000)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::Smoke check failed"
          exit 1

      - name: Image registered, service still at zero tasks
        if: steps.register.outputs.desired == '0'
        run: echo "::notice::Service has desired count 0, so nothing was started. Scale up with terraform to run it."
