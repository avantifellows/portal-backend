name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pre-commit/action@v3.0.0

  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --tb=short
        continue-on-error: true  # Allow failures for now since tests are minimal

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t portal-backend:ci .
      - name: Health check
        run: |
          docker run -d --name pb -p 8080:8080 \
            -e JWT_SECRET_KEY=x -e DB_SERVICE_URL=http://db.invalid -e DB_SERVICE_TOKEN=t \
            -e SQS_ACCESS_KEY=a -e SQS_SECRET_ACCESS_KEY=b -e AWS_SQS_URL=http://sqs.invalid \
            -e AWS_DEFAULT_REGION=ap-south-1 portal-backend:ci
          for i in $(seq 1 20); do
            curl -sf localhost:8080/health && exit 0
            sleep 2
          done
          docker logs pb
          exit 1
